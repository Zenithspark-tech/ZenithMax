services:
  - type: web
    name: zenithmax
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: zenithmax-data
      mountPath: /var/data
      sizeGB: 10
