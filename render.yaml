services:
  - type: web
    name: zenithmax-v17
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      # Optional server-side AI provider. Use an OpenAI-compatible endpoint.
      # - key: AI_API_URL
      # - key: AI_API_KEY
      # - key: AI_MODEL
    disk:
      name: zenithmax-data
      mountPath: /var/data
      sizeGB: 20
